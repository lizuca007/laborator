<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form onsubmit="return adaugaMasina()" novalidate>
<input id="marca" placeholder="Marca" required>
<input id="model" placeholder="Model" required>
<input id="culoare" placeholder="Culoare" required>
<input id="anFab" type="number" step="any" placeholder="An fabricatie" required>
<button type="submit">Adauga masina</button>
</form>
<p id="mesaj"></p>
<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
  
</table>
<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 

document.getElementById("tm").innerHTML +=  m2.randNou(); 
if(localStorage.masinaN) {
var masinaJSON = localStorage.masinaN;
var mNoua = JSON.parse(masinaJSON);

document.getElementById("tm").innerHTML += mNoua.randNou; // proprietate 
}



function masina(mk, md, cl, an){
this.marca= mk;
this.model = md;
this.culoare = cl;
this.anFab = an;
this.randNou = function() {return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"}
}
function valideaza(marca, model, culoare, an) {
if (!marca.trim() || !model.trim() || !culoare.trim()) {
return "Marca, modelul si culoarea nu pot fi goale sau formate doar din spatii.";
}

var anNumar = Number(an);
var anCurent = new Date().getFullYear();
if (!Number.isInteger(anNumar) || anNumar < 1900 || anNumar > anCurent) {
return "Anul fabricatiei trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
}

return "";
}
function adaugaMasina() {


var marca = document.getElementById("marca").value;
var model = document.getElementById("model").value;
var culoare = document.getElementById("culoare").value;
var anFab = document.getElementById("anFab").value;
var eroare = valideaza(marca, model, culoare, anFab);
document.getElementById("mesaj").textContent = eroare;
if (eroare) {
return false;
}
var mNoua = new masina(marca, model, culoare, anFab);

document.getElementById("tm").innerHTML +=  mNoua.randNou(); 

mNoua.randNou = mNoua.randNou().toString();
var myJSON = JSON.stringify(mNoua);

localStorage.setItem("masinaN", myJSON);


return false;
}
</script>
</body>
</html>
<!--
(a) Cheia masinaN contine un sir JSON cu detaliile masinii adaugate: marca,
model, culoare si randNou
(b) Apelul randNou() produce textul randului, iar toString() il pastreaza ca
sir . Fara inlocuire JSON.stringify omite proprietatea-function
dupa separare randNou ar fi undefined.
(c) Dupa JSON.parse, randNou este un sir  nu o functie. Fara paranteze sirul
este concatenat la innerHTML si interpretat ca markup, cu paranteze s-ar incerca
apelarea unui sir.
(d) Dupa reincarcare apare o singura masina adaugata, cea mai recent salvata la fel ca la L8_A.
-->
