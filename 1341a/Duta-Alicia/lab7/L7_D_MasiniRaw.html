<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare "bruta"</title>
	<script>
// "masina" JS
function loadMjs(){
document.getElementById("mjs").innerHTML = 
"<ul>"+
"<li>Tip:  Dacia</li>" +
"<li>Model:  Logan</li>" +
"<li>Culoare:  verde</li>" +
"</ul>";
}
// "masina" LS
function loadMls(){
	var mls = document.getElementById("mls");
	var tL = localStorage.getItem("tip");
	var mL = localStorage.getItem("model");
	var cL = localStorage.getItem("culoare");

	if(tL === null || mL === null || cL === null){
		mls.textContent = "Nicio mașină salvată";
		return;
	}

	var lista = document.createElement("ul");
	[["Tip", tL], ["Model", mL], ["Culoare", cL]].forEach(function(detaliu){
		var element = document.createElement("li");
		element.textContent = detaliu[0] + ": " + detaliu[1];
		lista.appendChild(element);
	});
	mls.replaceChildren(lista);
}
function salveazaMls(){
	localStorage.setItem("tip", document.getElementById("tipL").value);
	localStorage.setItem("model", document.getElementById("modelL").value);
	localStorage.setItem("culoare", document.getElementById("culoareL").value);
	loadMls();
	return false;
}
function stergeMls(){
	localStorage.removeItem("tip");
	localStorage.removeItem("model");
	localStorage.removeItem("culoare");
	loadMls();
}
// "masina" SS
function loadMss(){
	var mss = document.getElementById("mss");
	var tS = sessionStorage.getItem("tip");
	var mS = sessionStorage.getItem("model");
	var cS = sessionStorage.getItem("culoare");

	if(tS === null || mS === null || cS === null){
		mss.textContent = "Nicio mașină salvată";
		return;
	}

	var lista = document.createElement("ul");
	[["Tip", tS], ["Model", mS], ["Culoare", cS]].forEach(function(detaliu){
		var element = document.createElement("li");
		element.textContent = detaliu[0] + ": " + detaliu[1];
		lista.appendChild(element);
	});
	mss.replaceChildren(lista);
}
function salveazaMss(){
	sessionStorage.setItem("tip", document.getElementById("tipS").value);
	sessionStorage.setItem("model", document.getElementById("modelS").value);
	sessionStorage.setItem("culoare", document.getElementById("culoareS").value);
	loadMss();
	return false;
}
function stergeMss(){
	sessionStorage.removeItem("tip");
	sessionStorage.removeItem("model");
	sessionStorage.removeItem("culoare");
	loadMss();
}
</script>
</head>
<body>
<div style="background-color:rgb(243, 73, 186);color:white;font-size:200%" onclick="loadMjs()">
<p>Masina JavaScript</p>
	<div id="mjs"></div>
	</div>

<div style="background-color:rgb(247, 119, 189);color:white;font-size:200%">
	<p>Masina Local Storage</p>
	<form onsubmit="return salveazaMls()">
		<label for="tipL">Tip</label> <input id="tipL" required>
		<label for="modelL">Model</label> <input id="modelL" required>
		<label for="culoareL">Culoare</label> <input id="culoareL" required>
		<button type="submit">Salvează</button>
		<button type="button" onclick="stergeMls()">Șterge</button>
	</form>
	<div id="mls"></div>
	</div>

<div style="background-color:rgb(109, 34, 52);color:white;font-size:200%">
	<p>Masina Session Storage</p>
	<form onsubmit="return salveazaMss()">
		<label for="tipS">Tip</label> <input id="tipS" required>
		<label for="modelS">Model</label> <input id="modelS" required>
		<label for="culoareS">Culoare</label> <input id="culoareS" required>
		<button type="submit">Salvează</button>
		<button type="button" onclick="stergeMss()">Șterge</button>
	</form>
	<div id="mss"></div>
	</div>

	<script>
	loadMls();
	loadMss();
	</script>
	</body>
	</html>
