<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
   
          
     h1, caption { font-variant: large;
        color: rgb(255, 255, 255);
    background-color: #8f003c;
    }
      body { 
    background-color: #fcdbe5;
    }
.center, p { border: 2px solid pink;
  text-align: center;
  color: red;
}
th ,td{
border: 2px solid rgb(228, 6, 143);
padding: 10px;
}
table{
  border-collapse: collapse;
}
th{
background-color: rgb(7, 241, 222);
}
td{
background-color: rgb(255, 253, 118);
}
td[rowspan]{
background-color: rgb(7, 241, 222);
font-weight: bold;
text-align: center;
}
</style>
</head>

</html>
